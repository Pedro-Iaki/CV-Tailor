[project]
name = "cv-tailor"
version = "0.1.0"
description = "Tailor a one-page bilingual CV to a job description by selecting existing content only."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "anthropic>=2.9",
  "jinja2>=3.1",
  "weasyprint>=62",
  "pypdf>=4.0",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "mcp>=2.3",
]

[project.optional-dependencies]
clip = ["pyperclip>=1.8"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
